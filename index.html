<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Vozes do Atualia</title>
  <meta name="description" content="Ouça cada voz do Atualia lendo o mesmo trecho e compare família, gênero e custo.">
  <style>
    :root {
      color-scheme: light dark;
      --fundo: #f6f7f9;
      --superficie: #ffffff;
      --texto: #1a1d21;
      --texto-suave: #545b66;
      --borda: #dde1e6;
      --borda-forte: #7b8490;
      --destaque: #0f766e;
      --sobre-destaque: #ffffff;
      --apagado: #c5cbd3;
      --nota-fundo: #fff7e0;
      --nota-borda: #d4a017;
      --nota-rotulo: #7a5200;
      --erro-fundo: #fdecec;
      --erro-texto: #8a1c1c;
      --teste-fundo: #f3e8ff;
      --teste-borda: #c4b5fd;
      --teste-texto: #5b21b6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0f1316;
        --superficie: #171c21;
        --texto: #e8ebee;
        --texto-suave: #a3acb7;
        --borda: #2a3138;
        --borda-forte: #6b7581;
        --destaque: #5eead4;
        --sobre-destaque: #0f1316;
        --apagado: #3a424b;
        --nota-fundo: #2a2416;
        --nota-borda: #b8860b;
        --nota-rotulo: #f0c674;
        --erro-fundo: #3a1717;
        --erro-texto: #ffb4b4;
        --teste-fundo: #2a1d3d;
        --teste-borda: #7c5bb0;
        --teste-texto: #d8b4fe;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .pagina { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 2rem; }

    h1 { margin: 0 0 .5rem; font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem); line-height: 1.15; }
    h2 { margin: 0 0 .75rem; font-size: 1.125rem; line-height: 1.3; }
    .intro { margin: 0; max-width: 40rem; color: var(--texto-suave); }

    .aviso { max-width: 48rem; margin: 1rem 0 0; padding: .5rem .75rem; border-radius: .5rem; font-size: .875rem; }
    .aviso-exemplo { border: 1px dashed var(--borda-forte); color: var(--texto-suave); }
    .aviso-versao { border-left: 3px solid var(--nota-borda); background: var(--nota-fundo); }

    main > section { margin-top: 2rem; }

    .citacao {
      max-width: 48rem;
      margin: 0;
      padding: 1rem 1.25rem;
      border: 1px solid var(--borda);
      border-left: 4px solid var(--destaque);
      border-radius: .75rem;
      background: var(--superficie);
      font-size: 1.0625rem;
    }
    .citacao p { margin: 0; }

    .filtros { display: grid; gap: 1rem; margin-bottom: 1.25rem; }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    legend { margin-bottom: .5rem; padding: 0; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip { position: relative; display: inline-flex; }
    .chip input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .chip-corpo {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      min-height: 2.75rem;
      padding: .5rem 1rem;
      border: 1px solid var(--borda-forte);
      border-radius: 999px;
      background: var(--superficie);
      line-height: 1.2;
    }
    .chip:hover .chip-corpo { border-color: var(--destaque); }
    .chip input:checked + .chip-corpo { border-color: var(--destaque); background: var(--destaque); color: var(--sobre-destaque); font-weight: 600; }
    .chip input:focus-visible + .chip-corpo { outline: 3px solid var(--destaque); outline-offset: 2px; }
    .chip-cifroes { font-weight: 700; letter-spacing: .05em; color: var(--destaque); }
    .chip input:checked + .chip-corpo .chip-cifroes { color: inherit; }
    .ajuda { margin: .5rem 0 0; font-size: .875rem; color: var(--texto-suave); }

    .contagem { margin: 0 0 .75rem; font-size: .9375rem; color: var(--texto-suave); }
    .estado { margin: 0; padding: 1rem; border: 1px solid var(--borda); border-radius: .75rem; background: var(--superficie); }
    .estado:empty { display: none; }
    .estado.erro { border-color: transparent; background: var(--erro-fundo); color: var(--erro-texto); }

    .faixa + .faixa { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 2px solid var(--borda); }
    .faixa-topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; margin-bottom: .25rem; }
    .faixa-titulo { margin: 0; font-size: 1.375rem; line-height: 1.25; }
    .faixa-cifroes { margin-right: .5rem; font-weight: 700; letter-spacing: .08em; color: var(--destaque); }
    .faixa-conta { margin: 0; font-size: .9375rem; color: var(--texto-suave); }
    .familia-titulo {
      margin: 1.25rem 0 .625rem;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--texto-suave);
    }

    .lista {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr));
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .voz {
      display: flex;
      flex-direction: column;
      gap: .625rem;
      padding: 1rem;
      border: 1px solid var(--borda);
      border-radius: .75rem;
      background: var(--superficie);
    }
    .voz-topo { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
    .voz-nome { margin: 0; font-size: 1.1875rem; line-height: 1.25; overflow-wrap: anywhere; }
    .cifroes { margin: 0; font-weight: 700; letter-spacing: .08em; white-space: nowrap; color: var(--destaque); }
    .cifrao-apagado { color: var(--apagado); }
    .voz-meta { margin: 0; font-size: .9375rem; color: var(--texto-suave); }
    .provedor { font-size: .8125rem; }
    .nota { padding: .5rem .75rem; border-left: 3px solid var(--nota-borda); border-radius: .375rem; background: var(--nota-fundo); }
    .nota-rotulo { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nota-rotulo); }
    .nota-texto { margin: .125rem 0 0; }
    .selo-teste {
      align-self: flex-start;
      margin: 0;
      padding: .125rem .625rem;
      border: 1px solid var(--teste-borda);
      border-radius: 999px;
      background: var(--teste-fundo);
      color: var(--teste-texto);
      font-size: .8125rem;
      font-weight: 600;
    }
    .voz audio { display: block; width: 100%; margin-top: auto; }
    .sem-amostra {
      margin: auto 0 0;
      padding: .75rem;
      border: 1px dashed var(--borda-forte);
      border-radius: .5rem;
      font-size: .9375rem;
      text-align: center;
      color: var(--texto-suave);
    }
    .sem-amostra:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }

    .rodape { margin-top: 2.5rem; }
    .rodape p { margin: 0; padding-top: 1rem; border-top: 1px solid var(--borda); font-size: .875rem; color: var(--texto-suave); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 48rem) {
      .pagina { padding: 2.5rem 1.5rem 2rem; }
      .filtros { grid-template-columns: auto 1fr; gap: 1rem 2.5rem; }
    }

    @media (forced-colors: active) {
      .chip input:checked + .chip-corpo { forced-color-adjust: none; border-color: Highlight; background: Highlight; color: HighlightText; }
      .cifrao-apagado { forced-color-adjust: none; color: GrayText; }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header>
      <h1>Vozes do Atualia</h1>
      <p class="intro">Todas as vozes do bot leem o mesmo trecho. Ouça e compare.</p>
    </header>

    <main>
      <p id="aviso-exemplo" class="aviso aviso-exemplo" hidden>Dados de exemplo: a lista real ainda não foi publicada.</p>
      <p id="aviso-versao" class="aviso aviso-versao" hidden></p>

      <section id="trecho" aria-labelledby="trecho-titulo" hidden>
        <h2 id="trecho-titulo">O trecho</h2>
        <blockquote class="citacao"><p id="trecho-texto"></p></blockquote>
      </section>

      <section aria-labelledby="amostras-titulo">
        <h2 id="amostras-titulo">Amostras</h2>

        <div id="filtros" class="filtros" hidden>
          <fieldset>
            <legend>Voz</legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="genero" value="" checked><span class="chip-corpo">Todas</span></label>
              <label class="chip"><input type="radio" name="genero" value="F"><span class="chip-corpo">Feminina</span></label>
              <label class="chip"><input type="radio" name="genero" value="M"><span class="chip-corpo">Masculina</span></label>
            </div>
          </fieldset>
          <fieldset id="filtro-custo" aria-describedby="custo-ajuda">
            <legend>Custo</legend>
            <div id="chips-custo" class="chips">
              <label class="chip"><input type="radio" name="grupo" value="" checked><span class="chip-corpo">Todos</span></label>
            </div>
            <p id="custo-ajuda" class="ajuda">Quanto mais cifrões, mais créditos o áudio gasta.</p>
          </fieldset>
        </div>

        <p id="contagem" class="contagem" role="status"></p>
        <p id="estado" class="estado" role="status"></p>
        <noscript><p class="estado erro">Esta página precisa de JavaScript para mostrar as vozes.</p></noscript>
        <div id="lista" class="faixas"></div>
      </section>
    </main>

    <footer class="rodape">
      <p id="gerado-em" hidden></p>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const VERSAO_CONHECIDA = 1;
      const ESCALA_MINIMA = 4;
      const GENEROS = { F: 'Feminina', M: 'Masculina' };
      const SEM_AMOSTRA = 'Amostra indisponível no momento.';
      const ENDERECO_DA_LISTA = new URL('vozes.json', document.baseURI).href;

      const pegar = (id) => document.getElementById(id);
      const estado = pegar('estado');
      const lista = pegar('lista');
      const contagem = pegar('contagem');
      const filtros = pegar('filtros');
      let itens = [];
      let blocos = [];

      function criar(tag, classe, conteudo) {
        const no = document.createElement(tag);
        if (classe) no.className = classe;
        if (conteudo != null) no.textContent = conteudo;
        return no;
      }

      function texto(valor) {
        if (typeof valor === 'string') return valor.trim();
        if (typeof valor === 'number' && Number.isFinite(valor)) return String(valor);
        return '';
      }

      function contarCifroes(valor) {
        const s = texto(valor);
        return /^\$+$/.test(s) ? s.length : 0;
      }

      // O contrato dá o caminho relativo à pasta do vozes.json.
      // Só aceita amostras do próprio site: nada de recurso de terceiros.
      function enderecoDaAmostra(caminho) {
        const c = texto(caminho);
        if (!c) return null;
        try {
          const url = new URL(c, ENDERECO_DA_LISTA);
          return url.origin === location.origin ? url.href : null;
        } catch {
          return null;
        }
      }

      function mostrarEstado(mensagem, erro = false) {
        estado.textContent = mensagem;
        estado.classList.toggle('erro', erro);
      }

      function criarCifroes(n, escala, rotuloGrupo) {
        const p = criar('p', 'cifroes');
        p.append(criar('span', 'sr-only', `Custo ${n} de ${escala}${rotuloGrupo ? `, ${rotuloGrupo}` : ''}`));
        const visivel = criar('span', null, '$'.repeat(n));
        visivel.setAttribute('aria-hidden', 'true');
        if (escala > n) visivel.append(criar('span', 'cifrao-apagado', '$'.repeat(escala - n)));
        p.append(visivel);
        return p;
      }

      function trocarPorAviso(item) {
        const audio = item.audio;
        if (!audio) return;
        const aviso = criar('p', 'sem-amostra', SEM_AMOSTRA);
        aviso.tabIndex = -1;
        const tinhaFoco = document.activeElement === audio;
        audio.replaceWith(aviso);
        item.audio = null;
        if (tinhaFoco) aviso.focus();
      }

      function criarCartao(voz, porGrupo, escala, comFamilia) {
        const nome = texto(voz.rotulo) || 'Voz sem nome';
        const genero = texto(voz.genero).toUpperCase();
        const grupo = texto(voz.grupo);
        const infoGrupo = porGrupo.get(grupo);
        const cifroes = contarCifroes(voz.cifroes) || (infoGrupo ? infoGrupo.cifroes : 0);

        const li = criar('li', 'voz');
        const item = { el: li, audio: null, genero, grupo };

        const topo = criar('div', 'voz-topo');
        topo.append(criar('h5', 'voz-nome', nome));
        if (cifroes > 0) {
          topo.append(criarCifroes(cifroes, Math.max(escala, cifroes), infoGrupo ? infoGrupo.rotulo : ''));
        }
        li.append(topo);
        if (voz.em_teste === true) li.append(criar('p', 'selo-teste', 'Em fase de teste'));

        const detalhes = [comFamilia ? texto(voz.familia) : '', GENEROS[genero] || texto(voz.genero)].filter(Boolean);
        const provedor = texto(voz.provedor);
        if (detalhes.length || provedor) {
          const meta = criar('p', 'voz-meta', detalhes.join(' · '));
          if (provedor) {
            const marca = criar('span', 'provedor');
            marca.append(criar('span', 'sr-only', 'provedor '), provedor);
            if (detalhes.length) meta.append(' · ');
            meta.append(marca);
          }
          li.append(meta);
        }

        const nota = texto(voz.nota_curador);
        if (nota) {
          const caixa = criar('div', 'nota');
          caixa.append(criar('p', 'nota-rotulo', 'Nota do curador'), criar('p', 'nota-texto', nota));
          li.append(caixa);
        }

        const endereco = enderecoDaAmostra(voz.amostra);
        if (endereco) {
          const audio = criar('audio');
          audio.controls = true;
          audio.preload = 'none';
          audio.setAttribute('aria-label', `Amostra da voz ${nome}`);
          audio.addEventListener('error', () => trocarPorAviso(item));
          audio.src = endereco;
          item.audio = audio;
          li.append(audio);
        } else {
          li.append(criar('p', 'sem-amostra', SEM_AMOSTRA));
        }

        return item;
      }

      function montarFiltroDeCusto(grupos, escala) {
        if (grupos.length === 0) {
          pegar('filtro-custo').hidden = true;
          return;
        }
        const caixa = pegar('chips-custo');
        for (const g of grupos) {
          const rotulo = criar('label', 'chip');
          const opcao = criar('input');
          opcao.type = 'radio';
          opcao.name = 'grupo';
          opcao.value = g.id;
          const corpo = criar('span', 'chip-corpo');
          if (g.cifroes > 0) {
            const cifroes = criar('span', 'chip-cifroes', '$'.repeat(g.cifroes));
            cifroes.setAttribute('aria-hidden', 'true');
            corpo.append(cifroes, g.rotulo, criar('span', 'sr-only', `, custo ${g.cifroes} de ${escala}`));
          } else {
            corpo.append(g.rotulo);
          }
          rotulo.append(opcao, corpo);
          caixa.append(rotulo);
        }
      }

      const SEM_FAMILIA = 'Outras';

      // Uma faixa por grupo de custo, na ordem de grupos; dentro dela, as famílias na ordem em que aparecem no arquivo.
      // Voz de grupo que não está em grupos vai para uma faixa sem custo, no fim, e não some.
      function montarFaixas(vozes, grupos, porGrupo, escala) {
        const faixas = new Map();
        for (const g of grupos) faixas.set(g.id, { grupo: g, familias: new Map(), itens: [] });
        const avulsa = { grupo: null, familias: new Map(), itens: [] };
        const todos = [];
        for (const voz of vozes) {
          const faixa = faixas.get(texto(voz.grupo)) || avulsa;
          const familia = texto(voz.familia) || SEM_FAMILIA;
          if (!faixa.familias.has(familia)) faixa.familias.set(familia, []);
          const item = criarCartao(voz, porGrupo, escala, false);
          item.familia = familia;
          faixa.familias.get(familia).push(item);
          faixa.itens.push(item);
          todos.push(item);
        }
        const conjunto = document.createDocumentFragment();
        const blocos = [];
        for (const faixa of [...faixas.values(), avulsa]) {
          if (faixa.itens.length === 0) continue;
          const secao = criar('section', 'faixa');
          const topo = criar('div', 'faixa-topo');
          const titulo = criar('h3', 'faixa-titulo');
          if (faixa.grupo) {
            if (faixa.grupo.cifroes > 0) {
              const cifroes = criar('span', 'faixa-cifroes', '$'.repeat(faixa.grupo.cifroes));
              cifroes.setAttribute('aria-hidden', 'true');
              titulo.append(cifroes);
            }
            titulo.append(faixa.grupo.rotulo);
            if (faixa.grupo.cifroes > 0) titulo.append(criar('span', 'sr-only', `, custo ${faixa.grupo.cifroes} de ${escala}`));
          } else {
            titulo.append('Outras vozes');
          }
          const conta = criar('p', 'faixa-conta');
          topo.append(titulo, conta);
          secao.append(topo);
          const familias = [];
          for (const [nome, itensDaFamilia] of faixa.familias) {
            const bloco = criar('div', 'familia');
            bloco.append(criar('h4', 'familia-titulo', nome));
            const ul = criar('ul', 'lista');
            ul.setAttribute('role', 'list');
            for (const item of itensDaFamilia) ul.append(item.el);
            bloco.append(ul);
            secao.append(bloco);
            familias.push({ el: bloco, itens: itensDaFamilia });
          }
          conjunto.append(secao);
          blocos.push({ el: secao, conta, familias, itens: faixa.itens });
        }
        lista.append(conjunto);
        return { todos, blocos };
      }

      function contar(n) {
        return `${n} ${n === 1 ? 'voz' : 'vozes'}`;
      }

      function valorMarcado(nome) {
        const marcado = filtros.querySelector(`input[name="${nome}"]:checked`);
        return marcado ? marcado.value : '';
      }

      function aplicarFiltros() {
        const genero = valorMarcado('genero');
        const grupo = valorMarcado('grupo');
        let visiveis = 0;
        for (const item of itens) {
          const mostrar = (!genero || item.genero === genero) && (!grupo || item.grupo === grupo);
          item.el.hidden = !mostrar;
          if (mostrar) visiveis += 1;
          else if (item.audio) item.audio.pause();
        }
        for (const bloco of blocos) {
          let naFaixa = 0;
          for (const familia of bloco.familias) {
            const naFamilia = familia.itens.filter((item) => !item.el.hidden).length;
            familia.el.hidden = naFamilia === 0;
            naFaixa += naFamilia;
          }
          bloco.el.hidden = naFaixa === 0;
          bloco.conta.textContent = contar(naFaixa);
        }
        const total = itens.length;
        if (visiveis === 0) contagem.textContent = 'Nenhuma voz com esses filtros.';
        else if (visiveis === total) contagem.textContent = contar(total);
        else contagem.textContent = `${visiveis} de ${contar(total)}`;
      }

      function montar(dados) {
        if (dados.exemplo === true) pegar('aviso-exemplo').hidden = false;

        if (dados.versao !== VERSAO_CONHECIDA) {
          const aviso = pegar('aviso-versao');
          aviso.textContent = `A lista de vozes está num formato que esta página não conhece (versão ${texto(dados.versao) || 'sem número'}). Algumas informações podem faltar.`;
          aviso.hidden = false;
        }

        const trecho = texto(dados.texto_amostra);
        if (trecho) {
          pegar('trecho-texto').textContent = trecho;
          pegar('trecho').hidden = false;
        }

        const grupos = (Array.isArray(dados.grupos) ? dados.grupos : [])
          .filter((g) => g && texto(g.grupo))
          .map((g) => ({ id: texto(g.grupo), rotulo: texto(g.rotulo) || texto(g.grupo), cifroes: contarCifroes(g.cifroes) }));
        const escala = Math.max(ESCALA_MINIMA, ...grupos.map((g) => g.cifroes));
        const porGrupo = new Map(grupos.map((g) => [g.id, g]));

        const vozes = dados.vozes.filter((v) => v && typeof v === 'object');
        if (vozes.length === 0) {
          mostrarEstado('Nenhuma voz ativa no momento.');
          return;
        }

        const montado = montarFaixas(vozes, grupos, porGrupo, escala);
        itens = montado.todos;
        blocos = montado.blocos;

        montarFiltroDeCusto(grupos, escala);
        filtros.addEventListener('change', aplicarFiltros);
        filtros.hidden = false;
        aplicarFiltros();
        mostrarEstado('');

        const gerado = new Date(texto(dados.gerado_em));
        if (!Number.isNaN(gerado.getTime())) {
          const quando = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'long', timeStyle: 'short' }).format(gerado);
          const rodape = pegar('gerado-em');
          rodape.textContent = `Lista gerada em ${quando}.`;
          rodape.hidden = false;
        }
      }

      // Uma amostra por vez. O evento play não borbulha, por isso a escuta é na captura.
      document.addEventListener('play', (evento) => {
        for (const item of itens) {
          if (item.audio && item.audio !== evento.target) item.audio.pause();
        }
      }, true);

      async function iniciar() {
        mostrarEstado('Carregando as vozes…');
        let dados;
        try {
          const resposta = await fetch(ENDERECO_DA_LISTA, { cache: 'no-cache' });
          if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
          dados = await resposta.json();
        } catch {
          mostrarEstado(location.protocol === 'file:'
            ? 'Aberta direto do arquivo, a página não consegue ler a lista de vozes. Abra pelo servidor local.'
            : 'Não foi possível carregar a lista de vozes. Tente recarregar a página.', true);
          return;
        }
        if (!dados || typeof dados !== 'object' || !Array.isArray(dados.vozes)) {
          mostrarEstado('A lista de vozes veio num formato inesperado.', true);
          return;
        }
        try {
          montar(dados);
        } catch {
          mostrarEstado('Não foi possível mostrar a lista de vozes.', true);
        }
      }

      iniciar();
    })();
  </script>
</body>
</html>
